name: Publish Home Assistant app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-assistant-release
  cancel-in-progress: false

jobs:
  metadata:
    if: github.repository == 'SFenton/ha-native-home-app'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate release tag and master ancestry
        id: release
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          npx tsx scripts/release.ts metadata

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  images:
    needs: [metadata, checks]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}
      VERSION: ${{ needs.metadata.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build a staging image with OCI media types
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,push=true,oci-mediatypes=true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_REVISION=${{ github.sha }}
      - name: Verify production authentication, persistence and mounted routing
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/smoke-container.mjs "$IMAGE@$DIGEST"
      - name: Retain only the tested immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          retention-days: 7

  publish:
    needs: [metadata, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish version, verify anonymous pulls, then advance stable
        run: npx tsx scripts/release.ts publish "$RUNNER_TEMP/digests"
