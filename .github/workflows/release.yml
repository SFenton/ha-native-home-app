name: Publish Home Assistant app

# Every push to main releases: checks run, then the next version is chosen from
# the commits since the last tag (scripts/next-version.ts), recorded in a bot
# commit and tagged v<version>, and the image is built and published. A tag
# pushed with GITHUB_TOKEN starts no workflow, so every stage runs in this one
# run. workflow_dispatch (run on main) repeats or resumes a release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-assistant-release
  cancel-in-progress: false

jobs:
  checks:
    # The bot's own version commit never starts another release.
    if: >-
      github.repository == 'SFenton/ha-native-home-app'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
      || !(github.event.head_commit.author.name == 'github-actions[bot]'
      && startsWith(github.event.head_commit.message, 'Release ')))
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Choose the version, record it and tag it
        id: plan
        run: |
          set -euo pipefail
          git fetch origin main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved past $GITHUB_SHA; the run for the newer commit releases it"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx tsx scripts/next-version.ts plan | tee plan.txt
          action=$(sed -n 's/^action=//p' plan.txt)
          version=$(sed -n 's/^version=//p' plan.txt)
          rm plan.txt
          if [ -z "$version" ]; then
            echo "next-version.ts printed no version" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          case "$action" in
            bump)
              npx tsx scripts/next-version.ts apply
              npm run check:release
              git add config.yaml package.json package-lock.json CHANGELOG.md
              git commit -m "Release $version [skip ci]"
              git tag -a "v$version" -m "Native Home Studio $version"
              git push --atomic origin HEAD:refs/heads/main "refs/tags/v$version"
              ;;
            tag-as-is)
              npm run check:release
              git tag -a "v$version" -m "Native Home Studio $version"
              git push origin "refs/tags/v$version"
              ;;
            resume)
              echo "v$version is already tagged at this commit; publishing it again"
              ;;
            *)
              echo "unknown release action: '$action'" >&2
              exit 1
              ;;
          esac
          {
            echo "release=true"
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  metadata:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
      sha: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate release tag and main ancestry
        id: release
        env:
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          npx tsx scripts/release.ts metadata

  images:
    needs: metadata
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ needs.metadata.outputs.image }}
      VERSION: ${{ needs.metadata.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build a staging image with OCI media types
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,push=true,oci-mediatypes=true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:build-${{ needs.metadata.outputs.sha }}-${{ matrix.arch }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_REVISION=${{ needs.metadata.outputs.sha }}
      - name: Verify production authentication, persistence and mounted routing
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: node scripts/smoke-container.mjs "$IMAGE@$DIGEST"
      - name: Retain only the tested immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/
          retention-days: 7

  publish:
    needs: [metadata, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: v${{ needs.metadata.outputs.version }}
      RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish version, verify anonymous pulls, then advance stable
        run: npx tsx scripts/release.ts publish "$RUNNER_TEMP/digests"
