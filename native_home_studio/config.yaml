name: S+H Studio
version: 0.3.1
slug: native_home_studio
image: ghcr.io/sfenton/native-home-studio
arch:
  - amd64
  - aarch64
url: https://github.com/SFenton/ha-native-home-app
description: Design and publish the S+H app layout.
startup: application
boot: auto
stage: experimental
init: true
timeout: 30
backup: cold
ingress: true
ingress_port: 4800
panel_icon: mdi:cellphone-cog
panel_title: S+H Studio
panel_admin: true
homeassistant_api: true
ports:
  4800/tcp: null
ports_description:
  4800/tcp: Optional direct authoring port; configure auth_token before enabling.
options:
  auth_token: ""
  enable_live_actions: false
schema:
  auth_token: password?
  enable_live_actions: bool
